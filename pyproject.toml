[project]
name = "py-counter"
version = "0.1.0"
description = "Simple counter app."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.133.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "double"
